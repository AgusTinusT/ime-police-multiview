name: Laporan bug
description: Sesuatu tidak berjalan sebagaimana mestinya
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor! **Celah keamanan jangan dilaporkan di sini**; ikuti SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi?
      description: Jelaskan bug-nya dan apa yang seharusnya terjadi.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka halaman ...
        2. Klik ...
        3. Muncul ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Halaman / URL
      placeholder: /admin/officers, /@slug-officer, ...
  - type: input
    id: browser
    attributes:
      label: Browser dan perangkat
      placeholder: Chrome 131, Windows 11 / Safari iOS 18
  - type: textarea
    id: logs
    attributes:
      label: Screenshot atau log
      description: Lampirkan screenshot atau pesan galat. Hapus data pribadi terlebih dulu.
